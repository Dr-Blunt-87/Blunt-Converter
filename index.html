<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<title>Blunt Converter</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body { font-family: system-ui, sans-serif; background:#f3f4f6; margin:0; padding:20px; }
  .wrap { max-width:640px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; }
  .logo { width:48px; height:48px; border-radius:12px; background:#16a34a; color:#fff;
          display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; }
  h1 { color:#16a34a; margin:0; font-size:22px; }
  .sub { margin-left:auto; color:#6b7280; font-size:13px; }
  main { margin-top:16px; background:#fff; padding:20px; border-radius:14px;
         box-shadow:0 2px 6px rgba(0,0,0,0.08); }
  label { display:block; margin-bottom:6px; font-weight:600; font-size:14px; color:#374151; }
  .radios { display:flex; gap:8px; margin-bottom:16px; }
  .radios label { display:flex; align-items:center; gap:4px; font-weight:400; margin:0;
                   padding:8px 12px; border:1px solid #e5e7eb; border-radius:8px; cursor:pointer; }
  .radios input:checked + span { font-weight:700; }
  input[type=file] { display:block; margin-bottom:16px; }
  .checkbox-row { display:flex; align-items:center; gap:8px; margin-bottom:16px; font-size:14px; }
  button { background:#16a34a; color:#fff; border:none; padding:10px 18px; border-radius:8px;
           font-weight:600; cursor:pointer; font-size:14px; }
  button:disabled { background:#9ca3af; cursor:not-allowed; }
  .status { margin-top:16px; padding:12px; background:#f9fafb; border-radius:8px; font-size:14px; color:#374151; }
  .status strong { display:block; margin-bottom:4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">B</div>
    <h1>Blunt Converter</h1>
    <div class="sub">Video/Ljud &rarr; MIDI-stems</div>
  </header>

  <main>
    <label>Bläddra efter fil (MP4, MP3 eller WAV)</label>
    <input type="file" id="fileInput" accept=".mp4,.mp3,.wav,video/*,audio/*" />

    <div class="checkbox-row">
      <input type="checkbox" id="includeVocals" checked />
      <label for="includeVocals" style="margin:0;">Extrahera vokaler som eget MIDI-spår</label>
    </div>

    <button id="startBtn">Starta konvertering</button>

    <div class="status">
      <strong>Status:</strong>
      <span id="statusText">Väntar på input...</span>
    </div>
  </main>
</div>

<script>
  const BACKEND_URL = 'http://127.0.0.1:5000';
  const fileInput = document.getElementById('fileInput');
  const includeVocals = document.getElementById('includeVocals');
  const startBtn = document.getElementById('startBtn');
  const statusText = document.getElementById('statusText');

  startBtn.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if (!file) {
      statusText.textContent = 'Välj först en fil att konvertera.';
      return;
    }

    startBtn.disabled = true;
    statusText.textContent = 'Skickar fil till backend, separerar stems och konverterar till MIDI... Detta kan ta flera minuter beroende på fillängd.';

    const fd = new FormData();
    fd.append('file', file);
    fd.append('include_vocals', includeVocals.checked ? '1' : '0');

    try {
      const res = await fetch(`${BACKEND_URL}/upload`, { method: 'POST', body: fd });
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        statusText.textContent = 'Fel: ' + (j.error || res.statusText);
        startBtn.disabled = false;
        return;
      }
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'blunt_results.zip';
      document.body.appendChild(a);
      a.click();
      a.remove();
      statusText.textContent = 'Klart! ZIP med MIDI-filer nedladdad.';
    } catch (e) {
      statusText.textContent = 'Kunde inte nå backend på ' + BACKEND_URL + '. Kör den? (' + e.message + ')';
    } finally {
      startBtn.disabled = false;
    }
  });
</script>
</body>
</html>
